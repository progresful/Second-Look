name: SecondLook
options:
  bundleIdPrefix: fi.junction.secondlook
  deploymentTarget:
    iOS: "17.2"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
targets:
  SecondLook:
    type: application
    platform: iOS
    sources:
      - path: SecondLook
    entitlements:
      path: SecondLook/SecondLook.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.junction.secondlook
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SecondLook/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATSpeech
      - package: MWDAT
        product: MWDATMockDevice
      - package: FluidAudio
        product: FluidAudio
