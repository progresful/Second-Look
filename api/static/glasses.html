<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Look: glasses view demo</title>
<style>
  :root{--red:#ef4444;--amber:#f59e0b;--green:#22c55e;--grey:#94a3b8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0b0f14;color:#e8eef3;display:flex;gap:24px;padding:24px;flex-wrap:wrap;justify-content:center}
  h1{font-size:20px;margin:0 0 4px}.muted{color:#8a9bab;font-size:14px}

  /* First-person view */
  .view{position:relative;width:820px;height:560px;border-radius:28px;overflow:hidden;
        background:radial-gradient(ellipse at 50% 120%,#3a2f25 0%,#1e1915 45%,#100d0b 100%);box-shadow:0 0 0 2px #222}
  .view::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:28px;
        box-shadow:inset 0 0 120px 40px rgba(0,0,0,.75)}           /* lens vignette */
  .table{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#5a4532,#3b2c1f)}
  .object{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-3deg);transition:all .4s}

  /* phone */
  .phone{width:270px;height:470px;background:#111;border-radius:36px;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.6)}
  .screen{background:#f2f2f7;color:#111;height:100%;border-radius:24px;padding:18px 14px;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
  .sender{font-weight:600;text-align:center;font-size:13px;color:#555;margin-bottom:14px}
  .bubble{background:#e5e5ea;border-radius:18px;padding:10px 13px;max-width:92%}
  /* letter */
  .letter{width:400px;height:470px;background:#fbfaf6;color:#222;padding:30px 34px;font-family:Georgia,serif;font-size:15px;line-height:1.5;
          box-shadow:0 30px 60px rgba(0,0,0,.55)}
  .letter .logo{font-family:system-ui;font-weight:800;color:#f60;font-size:22px;margin-bottom:16px}
  /* laptop / web page */
  .web{width:520px;height:340px;background:#fff;color:#111;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6);font-size:15px}
  .web .bar{background:#e8e8e8;padding:8px 12px;font-family:ui-monospace,monospace;font-size:13px;color:#333}
  .web .body{padding:22px 26px;line-height:1.5}

  .call #txt{display:flex;flex-direction:column;gap:8px}
  .tline{background:#e5e5ea;border-radius:14px;padding:8px 11px;font-size:14px;animation:fade .4s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .sign{width:360px;background:#1d4ed8;color:#fff;border-radius:12px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.55);font-size:15px}
  .signhead{font-weight:800;font-size:20px;margin-bottom:12px}
  .qrcode{width:132px;height:132px;display:grid;grid-template-columns:repeat(11,1fr);background:#fff;padding:6px;margin:0 auto 12px;transform:rotate(4deg);box-shadow:2px 2px 0 #ccc}
  .qrcode i{display:block}
  .signtext{line-height:1.4}.scanned{margin-top:10px;background:rgba(0,0,0,.35);padding:6px 8px;border-radius:6px;font-size:13px}
  .object.full{left:0;top:0;width:100%;height:100%;transform:none}
  .photo{position:absolute;inset:0}.photo img{width:100%;height:100%;object-fit:cover;display:block}
  .pbox{position:absolute;border:3px solid transparent;border-radius:6px;transition:all .35s}
  .pbox.hit{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:0 0 14px var(--c)}
  .pbox span{position:absolute;left:0;top:100%;margin-top:3px;white-space:nowrap;font-size:11px;font-weight:600;color:#fff;
             background:var(--c);padding:1px 6px;border-radius:4px;opacity:0;transition:opacity .35s}
  .pbox.hit span{opacity:1}
  .pbox.up span{top:auto;bottom:100%;margin:0 0 3px}
  #scenarios{max-height:360px;overflow:auto;padding-right:4px}
  mark{background:transparent;color:inherit;border-radius:4px;transition:all .35s;outline:0 solid transparent}
  mark.hit{outline:3px solid var(--c,var(--red));background:color-mix(in srgb,var(--c,var(--red)) 18%,transparent)}

  /* capture + scan */
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:flash .35s}
  @keyframes flash{0%{opacity:.8}100%{opacity:0}}
  .scan{position:absolute;left:8%;right:8%;height:3px;background:#5cc8ff;box-shadow:0 0 18px 4px #5cc8ff;top:10%;opacity:0}
  .scan.on{opacity:1;animation:scan 1.1s ease-in-out 1}
  @keyframes scan{from{top:10%}to{top:90%}}

  /* Display HUD (right lens, monocular) */
  .hud{position:absolute;right:34px;top:34px;width:250px;padding:14px 16px;border-radius:16px;
       background:rgba(10,18,28,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);
       font-size:15px;line-height:1.35;opacity:0;transform:translateY(-8px);transition:all .35s;z-index:3}
  .hud.on{opacity:1;transform:none}
  .hud .v{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
  .hud ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:#cfd9e2}
  .rec{position:absolute;left:30px;top:30px;font-size:13px;display:flex;align-items:center;gap:6px;z-index:3;opacity:.0;transition:opacity .3s}
  .rec.on{opacity:1}.rec i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
  .caption{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:86%;background:rgba(0,0,0,.7);
           padding:10px 16px;border-radius:12px;font-size:17px;text-align:center;z-index:3;opacity:0;transition:opacity .3s}
  .caption.on{opacity:1}
  .user{position:absolute;left:30px;bottom:26px;font-size:15px;background:#1f3a5a;padding:8px 14px;border-radius:14px;z-index:3;opacity:0;transition:opacity .3s}
  .user.on{opacity:1}

  /* control panel */
  .panel{width:360px}
  .panel button{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border-radius:10px;border:1px solid #2a3a4a;background:#152230;color:#e8eef3;font-size:15px;cursor:pointer}
  .panel button:hover{background:#1d3042}.panel button.sel{border-color:#5cc8ff}
  .run{background:#2563eb!important;border:0!important;font-weight:600;text-align:center!important;margin-top:12px!important}
  .steps{margin-top:16px;font-size:14px;background:#111a23;border-radius:10px;padding:10px 12px;min-height:170px}
  .steps div{padding:4px 0;color:#8a9bab}.steps div.done{color:#e8eef3}.steps div.done::before{content:"✓ ";color:var(--green)}
  label{display:block;font-size:14px;margin:8px 0}
  .h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#8a9bab;margin:16px 0 6px}
</style>
</head>
<body>

<div>
  <h1>Second Look: what the glasses see</h1>
  <p class="muted" style="margin:0 0 12px">First-person view through Meta Ray-Ban Display. The card appears in the right lens.</p>
  <div class="view" id="view">
    <div class="table"></div>
    <div class="object" id="object"></div>
    <div class="flash" id="flash"></div>
    <div class="scan" id="scan"></div>
    <div class="rec" id="rec"><i></i>Camera on: checking this item only</div>
    <div class="hud" id="hud"></div>
    <div class="user" id="user">🗣 "Hey, is this real?"</div>
    <div class="caption" id="caption"></div>
  </div>
</div>

<div class="panel">
  <div class="h2">1. Pick what you're looking at</div>
  <div id="scenarios"></div>
  <div class="h2">2. Glasses</div>
  <label><input type="radio" name="dev" value="display" checked> Ray-Ban Display (card + voice)</label>
  <label><input type="radio" name="dev" value="audio"> Ray-Ban Meta Gen 2 (voice only)</label>
  <label><input type="checkbox" id="offline"> Simulate no network</label>
  <label><input type="checkbox" id="speak" checked> Speak the answer</label>
  <button class="run" onclick="run()">▶ Ask "Is this real?"</button>
  <div class="steps" id="steps"></div>
  <p class="muted" id="engine"></p>
</div>

<script>
const SCENARIOS = {
  photo: {name:"📸 Real photo: Ray-Ban webshop on a laptop", kind:"photo", img:"/static/shop-photo.jpg",
    url:"https://www.blickerz.com/en-fi/glasses/ray-ban-justin-rb4165-c55/4620233004285952/",
    text:"FREE SHIPPING TODAY. Black Friday | Unlock your access now. Up to 50% off selected styles. Ray-Ban Justin RB4165 C55 €20 €187 -36 % Shop now at Black Friday price. Unlock Black Friday. In stock, ready to ship. Add to cart | €120",
    // Boxes in % of the photo; each lights up only if the API returns one of its signal ids.
    boxes:[
      {l:12.5,t:15.8,w:37.8,h:2.6, ids:["lookalike_domain","new_domain","risky_tld"]},
      {l:42.2,t:20.2,w:11.3,h:2.6, ids:["bait_unlock"]},
      {l:66.3,t:49.4,w:3.2,h:2.7, ids:["price_too_low","price_mismatch"], up:true},
      {l:66.3,t:51.9,w:5.0,h:2.2, ids:["price_mismatch","unrealistic_offer"]},
      {l:66.7,t:60.2,w:28.5,h:4.6, ids:["bait_unlock"]},
      {l:66.9,t:82.6,w:24.9,h:4.7, ids:["price_mismatch"]},
    ]},
  posti: {name:"📱 Parcel SMS on a friend's phone", kind:"phone", sender:"+44 7700 900123",
    text:"Posti: Your parcel is waiting. Pay 1,99 € customs fee within 24 hours or it will be returned: posti-toimitus.top"},
  mum: {name:"📱 'Hi mum' WhatsApp message", kind:"phone", sender:"Unknown number",
    text:"Hi mum, my phone broke so this is my new number. Can you send 450 euros for rent today? I'll pay you back."},
  bank: {name:"✉️ Paper letter from 'the bank'", kind:"letter", logo:"Nordea Security",
    text:"Dear customer,\n\nUnusual activity was found on your account. Your account will be closed unless you verify your identity immediately.\n\nLog in here: nordea-tunnistus.icu and enter your banking codes.\n\nSecurity Department"},
  web: {name:"💻 Fake tax refund website", kind:"web", url:"vero-palautus.online/claim",
    text:"Verohallinto: tax refund of 312,40 € is waiting for you. Claim your refund now: enter your bank credentials to receive the payment."},
  kela: {name:"✉️ Real Kela letter (legit)", kind:"letter", logo:"Kela",
    text:"Hello,\n\nYour decision on housing allowance is ready. You can read it in our online service at kela.fi.\n\nIf you have questions, call our service number shown on kela.fi.\n\nKela"},

  // --- Calls: the glasses hear a speakerphone call and transcribe it live (user starts listening).
  callbank: {name:"📞 Call: 'bank security' wants your code", kind:"call", caller:"OP Security", number:"+358 9 4242 0000",
    lines:["Hello, this is OP Security. Someone is trying to take money from your account right now.",
           "To protect your savings we must move them to a safe account immediately.",
           "You just received a code by SMS. Please read me the code.",
           "And don't tell anyone at the branch, the criminals may work there."]},
  calltech: {name:"📞 Call: 'Microsoft' says your PC is infected", kind:"call", caller:"Unknown", number:"+1 202 555 0147",
    lines:["Hi, I'm calling from Microsoft support. Your computer is sending us virus warnings.",
           "Please install AnyDesk so I can fix it for you.",
           "There is a small 49 euro processing fee, you can pay with gift cards."]},
  callreal: {name:"📞 Call: real bank appointment (legit)", kind:"call", caller:"OP", number:"Saved contact",
    lines:["Hello, this is Laura from OP, calling about the loan meeting you booked.",
           "Is Thursday at 10 still good for you at the Kamppi branch?",
           "Remember, we never ask for your codes on the phone."]},

  // --- Shopping
  shop: {name:"🛒 Webshop: -80% sneakers, bank transfer only", kind:"web", url:"nike-outlet-sale.shop/checkout",
    text:"MEGA SALE -80% on all sneakers! Offer ends today. Payment: we accept only bank transfer. No returns on sale items."},
  shopreal: {name:"🛒 Real order confirmation (legit)", kind:"web", url:"verkkokauppa.com/fi/order",
    text:"Thank you for your order 123456. Payment received by card. Delivery to Posti pickup point in 2-3 working days. Track your order at verkkokauppa.com."},
  tori: {name:"💬 Tori buyer: 'click to receive payment'", kind:"phone", sender:"Tori buyer 'Mikko'",
    text:"Hi! I'll buy the sofa. I already paid with Tori delivery. Click to receive the money and enter your card details: tori-maksu.site"},

  // --- Physical world
  qr: {name:"🅿️ Parking sign with a QR sticker", kind:"qr", sign:"PARKING · Pay by app or scan", url:"parkki-maksu.click",
    text:"Parking fee unpaid. Scan to pay 0,50 € and enter your card details to avoid a fine of 80 €."},
  invoice: {name:"🧾 Invoice: 'our bank details have changed'", kind:"letter", logo:"Rakennus Oy (contractor)",
    text:"Invoice 2026-114\nKitchen renovation, final payment: 4 800 €\n\nPlease note: our bank details have changed. Pay to the new account number below immediately to avoid late fees."},

  // --- Social / ads
  invest: {name:"📈 Ad: 'guaranteed 300% returns'", kind:"web", url:"finance-news-today.online/tv-host-secret",
    text:"Famous TV host reveals: guaranteed returns of 300% with this crypto platform. Double your money in a week. Register now, last chance."},
  job: {name:"💼 Job offer: earn by liking videos", kind:"phone", sender:"Recruiter (WhatsApp)",
    text:"Hi! Part-time job: earn 300 euros per day by liking videos. To start, pay a 50 € registration fee in USDT."},
  romance: {name:"❤️ Online friend needs money", kind:"phone", sender:"Daniel ❤️",
    text:"My love, I'm stuck at the airport and need 900 euros for the ticket to finally meet you. Please send Apple gift cards. Don't tell your family, they won't understand us."},
  recover: {name:"🕵️ 'We recover lost money' offer", kind:"letter", logo:"Fund Recovery Agency",
    text:"We found the money you lost to an online scam. To release your funds we need a recovery fee of 350 €. Payment by bitcoin only."},
};

// Offline fallback, used when the API isn't reachable (mirrors the server rules, simplified).
const LOCAL_RULES = [
  [/\b(banking codes|bank credentials|pin|password)\b/i,"Asks for codes or passwords",0.9,"Real banks never ask for codes by message."],
  [/\b(customs fee|delivery fee)\b/i,"Small fee to release a parcel",0.6,"A small fee via a link is a common parcel scam."],
  [/\b(within 24 hours|immediately|today)\b/i,"False urgency",0.5,"Pressure to act fast stops you checking."],
  [/\b(will be closed|returned)\b/i,"Threat",0.4,"Threats are used to scare you into paying."],
  [/\bhi mum\b|\bnew number\b/i,"Pretends to be a relative",0.8,"Call your relative on their old number."],
  [/\b(claim your refund|tax refund)\b/i,"Too good to be true",0.6,"Unexpected refunds are bait."],
  [/\b(safe account|read me the code|anydesk|gift cards?|bitcoin|usdt|only bank transfer)\b/i,"Unusual payment or access request",0.9,"Real organisations never ask for this."],
  [/\b(don't tell|bank details have changed|registration fee|recovery fee|guaranteed returns|-80%)\b/i,"Classic scam pattern",0.6,"This is a well-known scam pattern."],
  [/[a-z0-9-]+\.(top|icu|online|xyz|shop|site|click)\b/i,"Lookalike or cheap website",0.75,"This is not the official website."],
];
function localAnalyze(text){
  const signals=LOCAL_RULES.map(([rx,label,w,ex])=>{const m=text.match(rx);return m&&{label,weight:w,explanation:ex,evidence:m[0],source:"offline rules"}}).filter(Boolean);
  const score=signals.reduce((a,s)=>a+s.weight,0);
  const verdict=score>=1.2?"scam":score>=0.55?"suspicious":"looks_ok";
  const reason=signals.sort((a,b)=>b.weight-a.weight)[0]?.explanation||"";
  const lead={scam:"Likely scam. Don't pay or reply.",suspicious:"Be careful.",looks_ok:"No scam signs found. If unsure, check with the official number."}[verdict];
  return {verdict,signals,reason,spoken:lead+(verdict!=="looks_ok"&&reason?" "+reason:""),llm_used:false,confidence:Math.min(1,Math.abs(score-0.55)/1.2)};
}

const COLORS={scam:"var(--red)",suspicious:"var(--amber)",looks_ok:"var(--green)",not_sure:"var(--grey)"};
const TITLES={scam:"Likely scam",suspicious:"Be careful",looks_ok:"No scam signs",not_sure:"Not sure"};
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current="posti", running=false;

function renderScenarioButtons(){
  $("scenarios").innerHTML=Object.entries(SCENARIOS).map(([k,s])=>
    `<button class="${k===current?'sel':''}" onclick="pick('${k}')">${s.name}</button>`).join("");
}
function renderObject(s){
  const body=esc(s.text).replace(/\n/g,"<br>");
  if(s.kind==="phone") return `<div class="phone"><div class="screen"><div class="sender">${esc(s.sender)}</div><div class="bubble" id="txt">${body}</div></div></div>`;
  if(s.kind==="letter") return `<div class="letter"><div class="logo">${esc(s.logo)}</div><div id="txt">${body}</div></div>`;
  if(s.kind==="photo") return `<div class="photo"><img src="${s.img}" alt="Photo of a laptop showing a Ray-Ban shop page"><div id="txt" hidden></div>
     ${s.boxes.map((b,i)=>`<div class="pbox${b.up?" up":""}" id="pbox${i}" style="left:${b.l}%;top:${b.t}%;width:${b.w}%;height:${b.h}%"><span></span></div>`).join("")}</div>`;
  if(s.kind==="call") return `<div class="phone"><div class="screen call"><div class="sender">📞 ${esc(s.caller)}<br><span style="font-weight:400">${esc(s.number)} · speaker on</span></div><div id="txt"></div></div></div>`;
  if(s.kind==="qr") return `<div class="sign"><div class="signhead">${esc(s.sign)}</div><div class="qrcode">${qrCells()}</div>
     <div id="txt" class="signtext">${body}</div><div class="scanned">Scanned link: <b id="urlbar">${esc(s.url)}</b></div></div>`;
  return `<div class="web"><div class="bar">🔒 <span id="urlbar">${esc(s.url)}</span></div><div class="body" id="txt">${body}</div></div>`;
}
function qrCells(){ let h=""; for(let i=0;i<121;i++) h+=`<i style="background:${(i*7919%13)<6?'#111':'#fff'}"></i>`; return h; }
function textOf(s){ return s.kind==="call" ? s.lines.join(" ") : s.text; }

// Calls: show the live transcript line by line before checking.
async function playCall(s){
  const box=$("txt");
  for(const line of s.lines){ const p=document.createElement("div"); p.className="tline"; p.textContent=line; box.appendChild(p); await sleep(900); }
}
function pick(k){ if(running) return; current=k; reset(); renderScenarioButtons(); }
function reset(){
  $("object").innerHTML=renderObject(SCENARIOS[current]);
  $("object").classList.toggle("full", SCENARIOS[current].kind==="photo");
  ["hud","caption","user","rec"].forEach(id=>$(id).classList.remove("on"));
  $("steps").innerHTML='<span class="muted">Press ▶ to run the check.</span>';
}
function step(t){ const d=document.createElement("div"); d.textContent=t; d.className="done"; if($("steps").querySelector(".muted")) $("steps").innerHTML=""; $("steps").appendChild(d); }

// Wrap each piece of evidence in the visible text with a highlight.
function highlight(signals, color){
  const nodes=[$("txt"), $("urlbar")].filter(Boolean);
  const done=[];
  // Longest evidence first, so "nordea-tunnistus.icu" wins over "nordea"; skip overlaps.
  for(const s of signals.filter(s=>s.weight>=0.3 && s.evidence).sort((a,b)=>b.evidence.length-a.evidence.length)){
    const ev=s.evidence.toLowerCase();
    if(done.some(d=>d.includes(ev))) continue;
    done.push(ev);
    for(const n of nodes){
      const i=n.innerHTML.toLowerCase().indexOf(esc(s.evidence).toLowerCase());
      if(i<0) continue;
      const len=esc(s.evidence).length;
      n.innerHTML=n.innerHTML.slice(0,i)+`<mark style="--c:${color}">`+n.innerHTML.slice(i,i+len)+"</mark>"+n.innerHTML.slice(i+len);
      break;
    }
  }
  return [...document.querySelectorAll("#object mark")];
}

async function analyze(text, url){
  if($("offline").checked) throw new Error("offline");
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),3000);
  try{
    const r=await fetch("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,url:url||null}),signal:ctrl.signal});
    if(!r.ok) throw new Error("bad");
    return Object.assign(await r.json(),{engine:"Live API"});
  } finally { clearTimeout(t); }
}

function say(text){
  $("caption").textContent="🔊 "+text; $("caption").classList.add("on");
  if($("speak").checked && "speechSynthesis" in window){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
}

async function run(){
  if(running) return; running=true; reset();
  const s=SCENARIOS[current], display=document.querySelector('input[name=dev]:checked').value==="display";
  if(s.kind==="call"){
    $("user").textContent='🗣 "Listen to this call"'; $("user").classList.add("on"); step('Voice trigger: "Listen to this call"'); await sleep(900);
    $("user").classList.remove("on"); $("rec").innerHTML="<i></i>Mic on: this call only, transcribed on the phone"; $("rec").classList.add("on");
    step("Glasses mics: live transcript (audio never uploaded)"); await playCall(s);
  } else {
    $("user").textContent='🗣 "Hey, is this real?"'; $("user").classList.add("on"); step('Voice trigger: "Is this real?"'); await sleep(900);
    $("user").classList.remove("on"); $("rec").innerHTML="<i></i>Camera on: checking this item only";
    $("rec").classList.add("on"); $("flash").classList.add("on"); step("Glasses camera: 1 frame captured");
    await sleep(350); $("flash").classList.remove("on");
    $("scan").classList.add("on"); step(s.kind==="qr"?"Phone: reading sign + decoding QR link":s.kind==="photo"?"Phone: reading screen text + address bar (on-device OCR)":"Phone: reading text (on-device OCR)"); await sleep(1100); $("scan").classList.remove("on");
  }
  step("Phone: personal details removed before upload");
  if(display){ $("hud").innerHTML='<div class="v"><span class="dot" style="--c:var(--grey)"></span>Checking…</div>'; $("hud").classList.add("on"); }

  let res;
  try{ res=await analyze(textOf(s), s.url); step("Hostinger API: verdict in "+res.latency_ms+" ms"); }
  catch(e){
    if($("offline").checked){
      res=Object.assign(localAnalyze(textOf(s)+" "+(s.url||"")),{engine:"Offline rules"});
      res.verdict = res.verdict==="looks_ok" ? "not_sure" : res.verdict;
      res.spoken = res.verdict==="not_sure" ? "I can't check fully right now. Don't pay yet. Call the official number." : res.spoken+" I'm offline, so this is a basic check.";
      step("No network: basic offline check only");
    } else { res=Object.assign(localAnalyze(textOf(s)+" "+(s.url||"")),{engine:"Demo fallback (API not reachable)"}); step("API not reachable: demo fallback rules"); }
  }
  $("rec").classList.remove("on"); step((s.kind==="call"?"Mic":"Camera")+" off. Nothing stored.");

  const color=COLORS[res.verdict];
  let marks=res.verdict==="looks_ok"?[]:highlight(res.signals, color);
  if(s.kind==="photo" && res.verdict!=="looks_ok"){
    marks=[];
    s.boxes.forEach((b,i)=>{ const sig=b.ids.map(id=>res.signals.find(x=>x.id===id)).find(Boolean); if(!sig) return;
      const el=$("pbox"+i); el.style.setProperty("--c",color); el.querySelector("span").textContent=sig.label; marks.push(el); });
  }
  for(const m of marks){ m.classList.add("hit"); await sleep(380); }
  if(marks.length) step(marks.length+" warning sign"+(marks.length>1?"s":"")+" highlighted");

  const reasons=res.signals.filter(x=>x.weight>0).sort((a,b)=>b.weight-a.weight).slice(0,3).map(x=>`<li>${esc(x.label)}</li>`).join("");
  if(display){
    $("hud").innerHTML=`<div class="v"><span class="dot" style="--c:${color}"></span>${TITLES[res.verdict]}</div>
      ${reasons?`<ul>${reasons}</ul>`:""}
      <div style="margin-top:8px;font-size:13px;color:#9fb0bf">${res.verdict==="looks_ok"?"Still unsure? Call the official number.":"Don't pay. Call the number on your card."}</div>`;
  }
  say(res.spoken); step(display?"Card shown + answer spoken":"Answer spoken (no display)");
  $("engine").textContent="Engine: "+res.engine+(res.llm_used?" + AI second opinion":"");
  running=false;
}

renderScenarioButtons(); reset();
</script>
</body>
</html>
